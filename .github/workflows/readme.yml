name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update age
        env:
          BIRTHDATE: ${{ secrets.BIRTHDATE }}
        run: |
          [ -z "$BIRTHDATE" ] && exit 0  # secret not set yet
          age=$(python3 -c "import datetime as d,os;b=d.date.fromisoformat(os.environ['BIRTHDATE']);t=d.date.today();print(t.year-b.year-((t.month,t.day)<(b.month,b.day)))")
          sed -i "s|<!--age-->[0-9]*<!--/age-->|<!--age-->$age<!--/age-->|" README.md
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update age" && git push

      # pushes via git from the checkout, so it must run before waka (which commits through the API)
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: update recent activity"
          MAX_LINES: 5

      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: false
          TIME_RANGE: last_30_days
          LANG_COUNT: 5
          BLOCKS: ⬜🟨🟩
          CODE_LANG: txt
          COMMIT_MESSAGE: "chore: update coding time"
